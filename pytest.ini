[pytest]
# 프로젝트 루트를 import 경로에 넣는다.
# 이게 있어야 tests/ 안에서 `from web.service import _monthly` 가 된다.
pythonpath = .

testpaths = tests

# -ra          : 실패/스킵 사유를 끝에 요약
# --strict-markers : 오타난 마커를 조용히 무시하지 않고 에러로 띄움
addopts = -ra --strict-markers

markers =
    db: 실제 MySQL 연결이 필요한 테스트. 기본 실행에서 빼려면 -m "not db"
    consistency: 페이지 간 산식 일치 회귀 테스트 (2026-09-06 사고 재발 방지)
    slow: 오래 걸리는 테스트
    llm: LLM 호출이 필요한 답변 평가 테스트. 기본 실행에서 빼려면 -m "not llm"
