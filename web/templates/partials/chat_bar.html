<!-- 공통 하단 채팅바: data.chat.title, data.chat.chips, data.chat.mascot,
     data.chat.send_icon, data.chat.action 사용

     칩은 원래 name="q" 로 이 폼을 제출했는데, /explore/result 가 q 를 지역명으로
     읽어서 "'…는 왜 월세 착시예요?' 는 서울 밖이거나 찾을 수 없어요" 가 떴다.
     보내기 버튼은 name 이 없어 아무 값도 없이 제출되며 화면 전체가 시연값으로
     되돌아갔다. data-loca-ask 를 붙여 loca_combo.js 가 제출을 가로챈다.
     스크립트가 죽으면 폼 제출로 물러서므로 화면이 멈추지는 않는다. -->
<div class="chat-bar">
  {% if data.chat.mascot %}
  <img class="chat-mascot" src="{{ url_for('static', filename=data.chat.mascot) }}" alt="">
  {% endif %}
  <div class="chat-body">
    <p class="chat-title">{{ data.chat.title }}</p>
    <form class="chat-input" method="get" action="{{ data.chat.action }}">
      <div class="chat-chips">
        {% for chip in data.chat.chips %}
        <button type="submit" name="q" value="{{ chip }}" class="chat-chip"
                data-loca-ask="{{ chip }}">{{ chip }}</button>
        {% endfor %}
      </div>
      <button type="submit" class="chat-send" aria-label="보내기">
        <img src="{{ url_for('static', filename=data.chat.send_icon) }}" alt="">
      </button>
    </form>
  </div>
</div>
